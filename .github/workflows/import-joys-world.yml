name: Import Joy's World project

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import uploaded project archive
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$zip_file" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          rm -rf .joy-import
          mkdir .joy-import
          unzip -q "$zip_file" -d .joy-import

          shopt -s dotglob nullglob
          entries=(.joy-import/*)
          source_dir=".joy-import"
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_dir="${entries[0]}"
          fi

          for item in "$source_dir"/*; do
            name="$(basename "$item")"
            if [ "$name" = ".git" ] || [ "$name" = ".github" ]; then
              continue
            fi
            rm -rf "./$name"
            cp -a "$item" "./$name"
          done

          rm -rf .joy-import "$zip_file"

      - name: Save imported source
        shell: bash
        run: |
          git config user.name "Joy's World Importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Import Joy's World project"
          git push
